<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Text Sanitiser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  HOME SCREEN                                                              -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<div id="home-screen">
  <div id="home-inner">
    <h1 class="home-title">PDF·SAN</h1>
    <p class="home-sub">Selective text rebuild tool</p>

    <!-- Drop zone -->
    <div class="drop-zone" id="drop-zone">
      <div class="drop-icon">⬆</div>
      <p class="drop-label">Drop a PDF here, or click to browse</p>
      <input type="file" id="file-input" accept=".pdf" style="display:none">
    </div>

    <!-- In-progress sessions -->
    <div id="session-list-wrap" style="display:none">
      <h2 class="section-title">In-progress sessions</h2>
      <div id="session-list"></div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  EDITOR SCREEN                                                            -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<div id="editor-screen" class="hidden">

  <!-- ── Toolbar ──────────────────────────────────────────────────────────── -->
  <div id="toolbar">
    <button class="tb-btn" id="btn-back" data-tip="Back to home">← Back</button>
    <span id="doc-title" class="doc-title"></span>
    <div class="sep"></div>

    <!-- Regex -->
    <input id="regex-input" type="text" class="regex-input" placeholder="regex pattern…" spellcheck="false" autocomplete="off">
    <div class="flag-group">
      <button class="flag-btn" id="flag-i" data-tip="Case-insensitive (i)">i</button>
      <button class="flag-btn" id="flag-m" data-tip="Multiline (m)">m</button>
      <button class="flag-btn" id="flag-s" data-tip="Dot-all (s)">s</button>
    </div>
    <button class="tb-btn accent" id="btn-select-regex" data-tip="Select all matches (Enter)">Select matches</button>
    <button class="tb-btn" id="btn-split-regex" data-tip="Split spans by match">Split matches</button>
    <button class="tb-btn" id="btn-save-preset" data-tip="Save this regex as a preset">+ Preset</button>

    <div class="sep"></div>

    <!-- Counters -->
    <div id="counters">
      <span class="cnt-item keep"><span class="dot dot-keep"></span><span id="cnt-kept">0</span></span>
      <span class="cnt-item del"><span class="dot dot-del"></span><span id="cnt-del">0</span></span>
    </div>

    <div class="sep"></div>
    <button class="tb-btn" id="btn-reset" data-tip="Reset all to drop">Reset all</button>
    <button class="tb-btn accent" id="btn-save" data-tip="Save PDF (Ctrl+S)">💾 Save</button>
  </div>

  <!-- ── Workspace ─────────────────────────────────────────────────────────── -->
  <div id="workspace">

    <!-- Left sidebar: Review Panel -->
    <div id="review-panel">
      <div class="review-header">To Keep</div>
      <div id="keep-list" class="review-list"></div>
      <div class="review-header">To Drop</div>
      <div id="drop-list" class="review-list"></div>
    </div>

    <!-- Scroll container: all pages stacked -->
    <div id="viewer-wrap">
      <div id="pages-container">
        <!-- page-block divs injected here by JS -->
      </div>
      <!-- Loading placeholder shown before session ready -->
      <div id="preparing-msg">
        <div class="spinner"></div>
        <p>Flattening text &amp; rendering pages…</p>
      </div>
    </div>

    <!-- Right sidebar: regex presets -->
    <div id="presets-panel">
      <div class="presets-header">Presets</div>
      <div id="presets-list">
        <!-- preset items injected by JS -->
        <p class="presets-empty">No presets yet.<br>Type a regex and click + Preset.</p>
      </div>

      <div class="presets-header" style="margin-top:20px">Find & Replace</div>
      <div id="find-replace-panel">
        <input id="find-input" type="text" placeholder="find regex..." class="regex-input" style="width:100%; margin-bottom:5px">
        <input id="replace-input" type="text" placeholder="replace with $1..." class="regex-input" style="width:100%; margin-bottom:5px">
        <div style="display:flex; gap:5px">
          <button class="tb-btn accent" id="btn-replace-all" style="flex:1">Replace All</button>
          <button class="tb-btn" id="btn-save-fr" title="Save this find/replace">+</button>
        </div>
        <div id="fr-list" style="margin-top:10px"></div>
      </div>
    </div>

  </div><!-- /workspace -->

  <!-- ── Status bar ─────────────────────────────────────────────────────────── -->
  <div id="statusbar">
    <span id="status-msg">Ready</span>
    <span id="status-zoom" style="margin-left:auto">100%</span>
  </div>

</div><!-- /editor-screen -->

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  FLOATING ACTION BAR  (shown when selection active)                      -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<div id="action-bar" class="hidden">
  <span id="sel-count">0 selected</span>
  <button class="ab-btn add"   id="ab-add"   data-tip="Keep (A)"><kbd>A</kbd> Keep</button>
  <button class="ab-btn merge" id="ab-split" data-tip="Split (S)"><kbd>S</kbd> Split</button>
  <button class="ab-btn drop"  id="ab-drop"  data-tip="Drop (D)"><kbd>D</kbd> Drop</button>
  <button class="ab-btn merge" id="ab-merge" data-tip="Merge (M)"><kbd>M</kbd> Merge</button>
  <button class="ab-btn clear" id="ab-clear" data-tip="Clear (Esc)">✕</button>
</div>

<!-- Edit preview tooltip -->
<div id="edit-preview" class="hidden"></div>

<!-- Rubber-band overlay canvas (fixed, full-viewport) -->
<canvas id="sel-canvas"></canvas>

<!-- Modal Editor -->
<div id="modal-editor-wrap" class="hidden">
  <div id="modal-editor-box">
    <textarea id="modal-editor-input" spellcheck="false"></textarea>
    <div class="modal-editor-tip">Enter to save, Esc to cancel</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
